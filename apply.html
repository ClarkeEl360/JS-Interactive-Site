<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><p><strong>Aplications</strong></p></header>

<nav>
  <a href="index.html">About Us</a>
  <a class="active" href="apply.html">Apply</a>
  <a href="https://docs.google.com/document/d/1ZhCrqAEcyT2Fp6_aXvhotrJBmGA_-lsJS_5qmQhx7cQ/edit?tab=t.0" style="color: #333">SECURE DOCUMENTS</a>
</nav>

<main>
  <h1>Apply Here</h1>
  <hr>
  <div class="left-right">
    <form id="left_form" class="form">
    
      <div class="left-up">
        <h2>Register For an Open Role</h2>
      </div>
      <div class="left-down" style="margin: 5px 4px">
        <div class="form-control">
          <label for="name">Name:</label>
          <input type="text" id="left_name" placeholder="*Enter name"><br>
          <span id="left_name_error"></span>
        </div>
        
        
        <div class="form-control">
          <label for="email">Email:</label>
          <input type="text" id="left_email" placeholder="*Enter email"><br>
          <span id="left_email_error"></span>
        </div>

        <label for="left_role">Choose a role:</label>
        <select id="left_role" name="left_role">
          <option value="p01">(P-01)Crew Member</option>
          <option value="p02">(P-02)Captain</option>
          <option value="p03">(P-03)Helmsman</option>
          <option value="p04">(P-04)Crew Member</option>
        </select>

        <br><br>
        <div class="form-control">
          <label for="more_info">More About You:</label><br>
          <input style="width: 95%" type="text" id="more_info" placeholder="Type Here">
        </div>

        <br><br>
        <button type="submit">Submit</button>
      </div>
    </form>




    <form id="right_form" class="form">
      <div class="right-up">
        <h2>Register For a Held Position</h2>
      </div>
      <div class="right-down" style="margin: 5px 4px">
        <div class="form-control">
          <label for="name">Name:</label>
          <input type="text" id="right_name" placeholder="*Enter name"><br>
          <span id="right_name_error"></span>
        </div>


        <div class="form-control">
          <label for="email">Email:</label>
          <input type="text" id="right_email" placeholder="*Enter email"><br>
          <span id="right_email_error"></span>
        </div>

        <label for="right_role">Choose a role:</label>
        <select id="right_role" name="right_role">
          <option value="p01">(P-01)Crew Member</option>
          <option value="p02">(P-02)Captain</option>
          <option value="p03">(P-03)Helmsman</option>
          <option value="p04">(P-04)Crew Member</option>
        </select>

        <br><br>
        <div class="form-control">
          <label for="more_info">More About You:</label><br>
          <input style="width: 95%" type="text" id="more_info" placeholder="Type Here">
        </div>

        <br><br>
        <button type="submit">Submit</button>
      </div>
    
    </form>
  </div>
</main>
<footer>
  <p>Thanks To All Our Sponsors</p>
  <a><img src="images/Wrath-Sponsor.png"></a>
  <a href="https://www.omegamart.com/"><img src="images/O-O-O-OMEGA-MART.png"></a>
  <br><br><br><br><br><br><br>
</footer>
<script src="apply.js"></script>
</body>
</html>
